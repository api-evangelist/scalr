          - AnsibleTowerMachineCredentialsWindows
          - AnsibleTowerMachineCredentialsLinux
          type: string
      required:
      - type
      x-concreteTypes:
      - $ref: '#/components/schemas/AnsibleTowerMachineCredentialsLinux'
