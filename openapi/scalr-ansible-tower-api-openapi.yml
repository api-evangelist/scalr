components:
  schemas:
    AnsibleTowerConfiguration:
      properties:
        allowOverride:
          description: Indicates whether the Configuration variables could be overridden on lower scopes.
          type: boolean
        credentials:
          items:
            $ref: '#/components/schemas/AnsibleTowerMachineCredentials'
          type: array
        groups:
          description: List of Ansible Tower Groups.
          items:
            $ref: '#/components/schemas/AnsibleTowerGroup'
          type: array
        id:
          description: The Ansible Tower configuration identifier.
          maxLength: 36
          minLength: 36
          pattern: '[A-Fa-f0-9]{8}-([A-Fa-f0-9]{4}-){3}[A-Fa-f0-9]{12}'
          readOnly: true
          type: string
        inventory:
          $ref: '#/components/schemas/ComposedAnsibleTowerInventoryIdentity'
        isShared:
          default: true
          description: Indicates whether the Configuration is available on lower scopes.
          type: boolean
        name:
          description: The Ansible Tower configuration name.
          type: string
        organization:
          $ref: '#/components/schemas/ComposedAnsibleTowerOrganizationIdentity'
        scope:
          enum:
          - scalr
          - account
          - environment
          - farm
          - farmrole
          - role
          - server
          readOnly: true
          type: string
        server:
          $ref: '#/components/schemas/AnsibleTowerServerForeignKey'
          description: Ansible Tower Server foreign key.
        variables:
          description: The Ansible Tower variables to override. JSON or YAML representation.
          type: string
      required:
      - name
      - server
      - organization
      - inventory
      x-filterable:
      - id
      - server
      - organization
      - inventory
      x-usedIn:
      - /account/{accountId}/ansible-tower/configurations/
      - /account/{accountId}/ansible-tower/configurations/{ansibleTowerConfigurationId}/
    AnsibleTowerGroupTemplate:
      properties:
        id:
          description: Unique identifier of the Ansible Tower Template Group.
          maxLength: 36
          minLength: 36
          pattern: '[A-Fa-f0-9]{8}-([A-Fa-f0-9]{4}-){3}[A-Fa-f0-9]{12}'
          type: string
        name:
          description: The name of the Ansible Tower Template Group.
          type: string
        type:
          enum:
          - AnsibleTowerGroupRegular
          - AnsibleTowerGroupTemplate
          type: string
      required:
      - type
      x-abstractType:
        $ref: '#/components/schemas/AnsibleTowerGroup'
      x-discriminator: type
    AnsibleTowerServerForeignKey:
      properties:
        id:
          type: string
      required:
      - id
      x-derived:
        $ref: '#/components/schemas/AnsibleTowerServer'
      x-references:
        $ref: '#/components/schemas/AnsibleTowerServer'
