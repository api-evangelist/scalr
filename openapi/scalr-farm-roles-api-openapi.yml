components:
  schemas:
    CloudSubnet:
      properties:
        id:
          type: string
        networkId:
          description: Identifier of the Network this Subnet belongs to.
          readOnly: true
          type: string
      required:
      - id
    ScriptVariableJson:
      properties:
        category:
          description: The category of this Variable.
          type: string
        description:
          description: A description that explains what this Global Variable is used for.
          type: string
        hidden:
          description: Whether this Script Variable is hidden in Orchestration Rules or execute Script action.
          type: boolean
        locked:
          description: Whether this Script Variable value is locked in Orchestration Rules or execute Script action.
          type: boolean
        name:
          description: The Variable Name
          type: string
        required:
          description: Whether this Script Variable value is required in Orchestration Rules or execute Script action.
          type: boolean
        type:
          description: The type of Script Variable.
          enum:
          - ScriptVariableJson
          - ScriptVariableString
          - ScriptVariableList
          - ScriptVariableRemoteList
          type: string
        value:
          description: The value declared in the script level. This property can be redefined for not locked variables in Orhestration Rules or execute Script action. Also this field supports Global Variable interpolation.
          type: string
      required:
      - name
      - type
      x-abstractType:
        $ref: '#/components/schemas/ScriptVariable'
      x-createOnly:
      - name
      x-discriminator: type
    AnsibleTowerAction:
      properties:
        actionType:
          enum:
          - ScalrScriptAction
          - RemoteScriptAction
          - ChefAction
          - LocalScriptAction
          - AnsibleTowerAction
          type: string
        configuration:
          $ref: '#/components/schemas/AnsibleTowerConfigurationIdentity'
          description: Ansible Tower identity stored at Bootstrap Configurations.
        jobTemplate:
          $ref: '#/components/schemas/JobTemplateIdentity'
          description: Ansible Tower Job template stored at Tower Server.
        variables:
          description: The Ansible Tower variables to override. JSON or YAML representation.
          type: string
      required:
      - actionType
      - configuration
      - jobTemplate
      x-abstractType:
        $ref: '#/components/schemas/Action'
      x-discriminator: actionType
    FarmTarget:
      description: Selects all the Servers that belong to the triggering Server's Farm.
      properties:
        conditions:
          description: 'Triggering servers conditions. '
          items:
            $ref: '#/components/schemas/OrchestrationRuleCondition'
          type: array
        targetType:
          enum:
          - TriggeringServerTarget
          - TriggeringFarmRoleTarget
          - FarmTarget
