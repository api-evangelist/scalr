          type: string
        message:
          description: A human-readable representation of the message.
          type: string
    AclRoleForeignKey:
      properties:
        id:
          description: Unique identifier for this ACL Role object.
          type: string
      required:
      - id
      x-derived:
        $ref: '#/components/schemas/AclRole'
      x-references:
        $ref: '#/components/schemas/AclRole'
    Team:
      properties:
        defaultAclRole:
          $ref: '#/components/schemas/AclRoleForeignKey'
          description: Default ACL Role for the Team. This ACL Role is applied by default to all the members of the Team, but it can be overridden for specific users.
        description:
          description: Description of the Team.
          type: string
        id:
          description: Identifier of the Team.
          readOnly: true
          type: integer
        name:
          description: Name of the Team.
          type: string
      required:
      - defaultAclRole
      - name
      x-filterable:
      - id
      - name
      - defaultAclRole
