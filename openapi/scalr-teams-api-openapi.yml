components:
  schemas:
    AclRole:
      properties:
        baseRole:
          description: Base ACL Role to override.
          enum:
          - no-access
          - full-access
          - read-only
          type: string
        id:
          description: Unique identifier for this ACL Role object.
          maxLength: 20
          minLength: 20
          pattern: '[A-Fa-f0-9]+'
          readOnly: true
          type: string
        name:
          description: Name of this ACL Role.
          type: string
      required:
      - name
      x-createOnly:
