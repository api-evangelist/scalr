apis:
- aid: scalr:scalr-iac-api
  name: Scalr IaC Management API
  description: >-
    The Scalr IaC Management API (TFC-compatible) provides programmatic control over workspaces, environments,
    runs, state, variables, policies, and provider configurations. Fully compatible with Terraform Cloud
    API and Terraform/OpenTofu CLI. Authenticates using Bearer tokens (personal or service account). Supports
    OIDC for GitHub, GitLab, AWS, Azure, and other identity providers.
  humanURL: https://docs.scalr.io/reference/overview-1
